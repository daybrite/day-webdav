[package]
name = "day-piece-webdav-settings"
version = "0.3.2"
edition = "2024"
rust-version = "1.100"
license = "MPL-2.0"
repository = "https://github.com/daybrite/day-webdav"
description = "Shared WebDAV account form for Day applications"

[package.metadata.day]
compat = "0.*"

[dependencies]
day-piece-settings = "0.*"
day-webdav = { path = "../..", version = "0.*" }
day = { package = "day-app", version = "0.*", default-features = false }

[dev-dependencies]
day = { package = "day-app", version = "0.*", features = ["mock"] }
